[package]
name = "food-ordering-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
actix-web = "=4.15.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "json"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
sha2 = "=0.10.9"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
